# Server Port (0 means random available port to avoid conflicts)
server.port=0

# Database for Testing (H2)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always

# Flyway
spring.flyway.enabled=false

# Cache
spring.cache.type=none
spring.data.redis.port=6380

# App Properties
app.base-url=http://localhost:8080
app.client-url=http://localhost:3000
app.context-path=/api/v1

# Security
app.security.jwt-secret=test-secret-key-test-secret-key-test-secret-key-test-secret-key
app.security.jwt-expiration-ms=3600000
app.security.trusted-hosts=localhost,127.0.0.1
app.security.encryption-secret=12345678901234567890123456789012
app.security.hash-pepper=test-pepper
app.security.keys.aes-v1=12345678901234567890123456789012

# Mail
app.mail.resend-api-key=dummy
app.mail.from-email=no-reply@example.com

# Cloudinary
app.cloudinary.cloud-name=dummy
app.cloudinary.api-key=dummy
app.cloudinary.api-secret=dummy

# OAuth2 Dummy Configs for Tests
app.oauth2.google.client-id=dummy
app.oauth2.google.client-secret=dummy
app.oauth2.google.redirect-uri=http://localhost:8080/api/v1/auth/google/callback
app.oauth2.google.frontend-callback-url=http://localhost:3000/auth/callback

app.oauth2.zalo.client-id=dummy
app.oauth2.zalo.client-secret=dummy
app.oauth2.zalo.redirect-uri=http://localhost:8080/api/v1/auth/zalo/callback
app.oauth2.zalo.frontend-callback-url=http://localhost:3000/auth/callback

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
app.kafka.topics.property-sync=omnibooking-property-sync

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200

spring.main.allow-bean-definition-overriding=true
management.health.redis.enabled=false
