spring.application.name=Server
server.servlet.context-path=/api/v1
server.forward-headers-strategy=native
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.client-url=${CLIENT_URL:${NEXT_PUBLIC_WEB_URL}}
app.context-path=${server.servlet.context-path}

# Redis Configuration
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Elasticsearch Configuration
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
# Disable auto-index creation if you want manual control
# spring.elasticsearch.index.auto-create=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:omnibooking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000

# Enable Virtual Threads (Java 21) - Crucial for handling massive concurrent requests
spring.threads.virtual.enabled=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Logging Aesthetics (NestJS Style)
spring.main.banner-mode=off
spring.output.ansi.enabled=always
logging.pattern.console=%clr([OmniBooking]){cyan} %clr(%d{HH:mm:ss}){faint} %clr(%5p) %clr(---){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Silence almost everything except App logs
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.boot.StartupInfoLogger=INFO
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data=WARN
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.flywaydb=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN

# JWT Configuration
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-ms=900000
app.security.cookie-secure=${COOKIE_SECURE:false}
app.security.cookie-domain=${COOKIE_DOMAIN:}
app.security.trusted-hosts=${TRUSTED_HOSTS:localhost,127.0.0.1}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3005,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3005}
app.security.csrf-bypass-patterns=${CSRF_BYPASS_PATTERNS:/auth/login,/auth/login/**,/**/auth/login,/**/auth/login/**,/auth/register,/auth/register/**,/**/auth/register,/**/auth/register/**,/auth/refresh,/auth/refresh/**,/**/auth/refresh,/**/auth/refresh/**,/auth/logout,/auth/logout/**,/**/auth/logout,/**/auth/logout/**,/auth/2fa/login,/auth/2fa/login/**,/**/auth/2fa/login,/**/auth/2fa/login/**,/auth/forgot-password,/auth/forgot-password/**,/**/auth/forgot-password,/**/auth/forgot-password/**,/auth/reset-password,/auth/reset-password/**,/**/auth/reset-password,/**/auth/reset-password/**,/auth/activate-guest,/auth/activate-guest/**,/**/auth/activate-guest,/**/auth/activate-guest/**,/auth/finalize-registration,/auth/finalize-registration/**,/**/auth/finalize-registration,/**/auth/finalize-registration/**,/payments/*/callback,/**/payments/*/callback}
app.security.csrf-secret=${CSRF_SECRET:csrf-fallback-super-secret-key-32bytes-omnibooking}
app.security.encryption-secret=${ENCRYPTION_SECRET}
app.security.hash-pepper=${HASH_PEPPER}
app.security.active-key-id=${ENCRYPTION_ACTIVE_KEY_ID:aes-v1}
app.security.keys.aes-v1=${ENCRYPTION_KEY_AES_V1}
app.security.credential-encryption-key-version=aes-v1

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.interceptor.classes=com.omnibooking.config.observability.KafkaTracingInterceptor
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.consumer.group-id=omnibooking-mail-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.omnibooking.dto,com.omnibooking.dto.event
app.kafka.partitions=${KAFKA_PARTITIONS:3}
app.kafka.replicas=${KAFKA_REPLICAS:1}
app.kafka.topics.property-sync=omnibooking-property-sync
omnibooking.kafka.registration.topic-name=${KAFKA_REGISTRATION_TOPIC:registration-request-topic}
omnibooking.kafka.registration.partitions=${KAFKA_REGISTRATION_PARTITIONS:16}
omnibooking.kafka.registration.replications=${KAFKA_REGISTRATION_REPLICATIONS:1}

# Resend Configuration
app.mail.resend-api-key=${RESEND_API_KEY}
app.mail.from-email=${MAIL_FROM:OmniBooking <support@zeion.online>}

# Cloudinary Configuration
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.properties-base-folder=${CLOUDINARY_PROPERTIES_BASE_FOLDER:properties}

# Media Progress Configuration
app.media.progress.upload-weight=25
app.media.progress.processing-weight=75
app.media.progress.retention-ttl=86400
app.media.progress.stall-timeout=120
app.media.progress.stall-check-interval=30
app.media.progress.sse-timeout=300000
app.media.progress.sse-heartbeat-interval=15
app.media.progress.max-emitters-per-property=5

# Zalo OAuth2 Configuration
app.oauth2.zalo.client-id=${ZALO_CLIENT_ID}
app.oauth2.zalo.client-secret=${ZALO_CLIENT_SECRET}
app.oauth2.zalo.redirect-uri=${ZALO_REDIRECT_URI}
app.oauth2.zalo.frontend-callback-url=${ZALO_FRONTEND_CALLBACK_URL}

# Google OAuth2 Configuration
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
app.oauth2.google.frontend-callback-url=${FRONTEND_AUTH_CALLBACK_URL:http://localhost:3000/auth/callback}

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.externalService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.externalService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.externalService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.externalService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.externalService.waitDurationInOpenState=10s

resilience4j.retry.instances.externalService.maxAttempts=3
resilience4j.retry.instances.externalService.waitDuration=2s
resilience4j.retry.instances.externalService.retryExceptions=java.io.IOException,org.springframework.web.client.RestClientException

# Currency Configuration
app.currency.api-key=${APP_CURRENCY_API_KEY}

# WebAuthn Configuration
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.rp-name=${WEBAUTHN_RP_NAME:OmniBooking}
app.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:3000}

# Cloudflare Turnstile Configuration
app.turnstile.enabled=${TURNSTILE_ENABLED:true}
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
app.turnstile.verify-url=${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}

# ─── Sentry Observability ───
sentry.dsn=${SENTRY_DSN_SERVER:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.release=omnibooking-server@${APP_VERSION:0.1.0}
sentry.send-default-pii=false
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}
sentry.enable-tracing=true
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info
sentry.exception-resolver-order=-2147483647

# ─── Prometheus Metrics ───
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${SENTRY_ENVIRONMENT:development}

# Expose Resilience4j metrics to Micrometer/Prometheus
resilience4j.circuitbreaker.metrics.enabled=true
resilience4j.retry.metrics.enabled=true

# Hibernate statistics for slow query detection
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.omnibooking.config.observability.QueryPerformanceInterceptor
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# MoMo Sandbox Integration Configurations
momo.partner-code=MOMOBKUN20180529
momo.access-key=klm05TvNBzhg7h7j
momo.secret-key=at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa
momo.api-url=https://test-payment.momo.vn/v2/gateway/api/create
momo.return-url=${app.client-url}/vi/booking/success
momo.notify-url=${app.base-url}/api/v1/payments/momo/callback

# Seeding Configuration
app.seeding.enabled=${APP_SEEDING_ENABLED:true}
