spring.application.name=Server
server.servlet.context-path=/api/v1
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.client-url=${CLIENT_URL:http://localhost:3000}
app.context-path=${server.servlet.context-path}

# Redis Configuration
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Elasticsearch Configuration
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
# Disable auto-index creation if you want manual control
# spring.elasticsearch.index.auto-create=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:omnibooking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Aesthetics (NestJS Style)
spring.main.banner-mode=off
spring.output.ansi.enabled=always
logging.pattern.console=%clr([OmniBooking]){cyan} %clr(%d{HH:mm:ss}){faint} %clr(%5p) %clr(---){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Silence almost everything except App logs
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.boot.StartupInfoLogger=INFO
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data=WARN
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.flywaydb=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN

# JWT Configuration
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-ms=900000
app.security.cookie-secure=${COOKIE_SECURE:false}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=omnibooking-mail-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.omnibooking.dto.event
app.kafka.partitions=${KAFKA_PARTITIONS:3}
app.kafka.replicas=${KAFKA_REPLICAS:1}
app.kafka.topics.property-sync=omnibooking-property-sync

# Resend Configuration
app.mail.resend-api-key=${RESEND_API_KEY}
app.mail.from-email=${MAIL_FROM:OmniBooking <no-reply@zeion.online>}

# Cloudinary Configuration
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Zalo OAuth2 Configuration
app.oauth2.zalo.client-id=${ZALO_CLIENT_ID}
app.oauth2.zalo.client-secret=${ZALO_CLIENT_SECRET}
app.oauth2.zalo.redirect-uri=${ZALO_REDIRECT_URI}
app.oauth2.zalo.frontend-callback-url=${ZALO_FRONTEND_CALLBACK_URL}

# Google OAuth2 Configuration
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
app.oauth2.google.frontend-callback-url=${FRONTEND_AUTH_CALLBACK_URL:http://localhost:3000/auth/callback}

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.externalService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.externalService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.externalService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.externalService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.externalService.waitDurationInOpenState=10s

resilience4j.retry.instances.externalService.maxAttempts=3
resilience4j.retry.instances.externalService.waitDuration=2s
resilience4j.retry.instances.externalService.retryExceptions=java.io.IOException,org.springframework.web.client.RestClientException

