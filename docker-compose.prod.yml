services:
  db:
    image: postgres:16-alpine
    container_name: omnibooking-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:latest
    container_name: omnibooking-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:latest
    container_name: omnibooking-kafka-prod
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: omnibooking-kafdrop-prod
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"

  server:
    build: ./Server
    container_name: omnibooking-server-prod
    restart: unless-stopped
    env_file:
      - env/.env.prod
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_SERVERS=kafka:29092
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    build:
      context: .
      dockerfile: elasticsearch.Dockerfile
    container_name: omnibooking-elastic-prod
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: omnibooking-kibana-prod
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  client-web:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        - APP_NAME=web
    container_name: omnibooking-client-web-prod
    restart: unless-stopped
    env_file:
      - env/.env.prod
    environment:
      - NEXT_PUBLIC_API_URL=http://server:8080/api/v1/
      - BACKEND_URL=http://server:8080
    depends_on:
      - server

  client-partner:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        - APP_NAME=partner
    container_name: omnibooking-client-partner-prod
    restart: unless-stopped
    env_file:
      - env/.env.prod
    environment:
      - NEXT_PUBLIC_API_URL=http://server:8080/api/v1/
      - BACKEND_URL=http://server:8080
    depends_on:
      - server

  client-owner:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        - APP_NAME=owner
    container_name: omnibooking-client-owner-prod
    restart: unless-stopped
    env_file:
      - env/.env.prod
    environment:
      - NEXT_PUBLIC_API_URL=http://server:8080/api/v1/
      - BACKEND_URL=http://server:8080
    depends_on:
      - server

  prometheus:
    image: prom/prometheus:latest
    container_name: omnibooking-prometheus-prod
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: omnibooking-grafana-prod
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: omnibooking-cloudflared-prod
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - client-web
      - client-partner
      - client-owner
      - server

volumes:
  postgres_data:
  redis_data:
  elastic_data:
  prometheus_data:
  grafana_data:
