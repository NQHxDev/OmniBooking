name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Server
        run: cd Server && mvn clean package -DskipTests
        env:
          JWT_SECRET: dummy_jwt_secret_for_ci_validation
          RESEND_API_KEY: re_dummy_key
          CLOUDINARY_CLOUD_NAME: dummy_cloud
          CLOUDINARY_API_KEY: dummy_api_key
          CLOUDINARY_API_SECRET: dummy_api_secret

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm install --prefix Client

      - name: Build Client
        run: npm run build --prefix Client
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1/"
          NODE_ENV: production
          CI: true
