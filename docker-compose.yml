services:
  db:
    image: postgres:16-alpine
    container_name: omnibooking-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:latest
    container_name: omnibooking-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  server:
    build: ./Server
    container_name: omnibooking-server
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

  client:
    build: ./Client
    container_name: omnibooking-client
    ports:
      - "${CLIENT_PORT}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
